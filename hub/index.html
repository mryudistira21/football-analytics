<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liga Nusantara Hub</title>
<meta name="description" content="Clubs, squads, fixtures, standings, scorers and your own match analysis for Liga Nusantara 2026-27.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef2ee;--surface:#ffffff;--surface-2:#f5f8f5;--ink:#15211b;--muted:#5a6a61;--line:#d3dcd5;
  --accent:#1d5fc4;--accent-ink:#fff;--warn:#b4541a;--ok:#1f7a4a;--turf:#2e7a4c;--turf-2:#2a7146;--chalk:rgba(255,255,255,.82);
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--fb:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;--r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1310;--surface:#151d19;--surface-2:#1b2520;--ink:#e5ece7;--muted:#93a39a;--line:#28342d;
  --accent:#7aa7ff;--accent-ink:#0d1310;--warn:#f0a35e;--ok:#6fd39a;--turf:#24603d;--turf-2:#215838;--chalk:rgba(255,255,255,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310;--surface:#151d19;--surface-2:#1b2520;--ink:#e5ece7;--muted:#93a39a;--line:#28342d;
  --accent:#7aa7ff;--accent-ink:#0d1310;--warn:#f0a35e;--ok:#6fd39a;--turf:#24603d;--turf-2:#215838;--chalk:rgba(255,255,255,.7);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;margin:0;
  padding:14px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;letter-spacing:.01em}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:12px 16px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:28px;text-transform:uppercase}
.top .sub{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 11px;font-family:var(--fd);font-size:17px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25);display:inline-block;vertical-align:-1px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:inherit;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=text],input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font:inherit;color:inherit;width:100%}
.me{color:var(--warn);font-weight:700}
.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.badge.on{color:var(--ok);border-color:var(--ok)}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.st.analysed,.st.reviewed{color:var(--ok);border-color:var(--ok)}
.st.queued{color:var(--accent);border-color:var(--accent)}
.st.ready{color:var(--ink);border-color:var(--ink)}
.st.needs_times,.st.needs_video{color:var(--warn);border-color:var(--warn)}
.stsum{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.stsum .card{padding:8px 12px;min-width:110px}.stsum b{font-family:var(--fd);font-size:22px;display:block}
.ptw{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ptw .card{padding:10px 12px}.ptw .num{font-family:var(--fm);color:var(--muted);margin-right:6px}
.scorers{font-size:11px;color:var(--muted);grid-column:1/-1;text-align:center}
.nextm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:12px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.clubcard{display:flex;align-items:center;gap:10px;cursor:pointer}
.clubcard .bar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.clubcard h3{font-size:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--fb);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:var(--surface-2)}
.stand{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:12px;align-items:start}
@media (max-width:900px){.stand{grid-template-columns:1fr}}
.grp h2{font-size:18px;text-transform:uppercase;margin-bottom:6px}
.pos{width:26px;text-align:center;color:var(--muted);font-family:var(--fm)}
.fx{display:flex;flex-direction:column;gap:6px}
.fxday{font-family:var(--fd);text-transform:uppercase;font-size:14px;color:var(--muted);margin:10px 0 2px}
.fxrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fxrow .h{text-align:right}.fxrow .sc{font-family:var(--fd);font-size:20px;padding:0 8px;white-space:nowrap}
.fxrow .tm{display:inline-flex;align-items:center;gap:6px}.fxrow .h .tm{flex-direction:row-reverse}
.fxmeta{grid-column:1/-1;display:flex;justify-content:center;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
.back{margin-bottom:10px}
.squadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px}
.pl:hover{background:var(--surface-2)}.pl .num{width:26px;text-align:right;color:var(--muted);font-family:var(--fm)}
.note{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pitch{display:block;width:100%;max-width:420px;height:auto;border-radius:6px}
.anrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.kv{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.terr{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:12px;color:#fff;margin:6px 0}.terr div{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap}
.heat2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.qual{font-size:12px;color:var(--muted);margin:2px 0 8px}
.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv .v{font-family:var(--fd);font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
@media (max-width:560px){.top h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Liga Nusantara</h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <a class="btn small" id="taggerLink" href="#" target="_blank" rel="noopener">Pitchside Tagger ↗</a>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="standings" aria-selected="true">Standings</button>
    <button role="tab" data-tab="fixtures" aria-selected="false">Fixtures</button>
    <button role="tab" data-tab="clubs" aria-selected="false">Clubs</button>
    <button role="tab" data-tab="players" aria-selected="false">Players</button>
    <button role="tab" data-tab="scorers" aria-selected="false">Scorers</button>
    <button role="tab" data-tab="status" aria-selected="false">Status</button>
    <button role="tab" data-tab="analysis" aria-selected="false">My analysis</button>
  </nav>
  <main id="body"><div class="empty">Loading league data…</div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PL=105,PW=68,MYCLUB="BTL",TAGGER="https://claude.ai/artifact/9d6kEj3CJLuLTadYPLgNBp";
let toastT;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)};
let DATA=null, byShort={}, byName={}, view={tab:"standings"}, analyses=[], anPeriod="all";

/* ---------- storage for imported analyses ---------- */
const Store={db:null,
  async init(){try{if(window.claude&&claude.use){const db=await claude.use("db");if(db){this.db=db;return}}}catch(e){}},
  async list(){
    if(this.db){try{const s=await this.db.collection("analyses").get();return s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}))}catch(e){}}
    try{return JSON.parse(localStorage.getItem("hub:analyses")||"[]")}catch(e){return[]}
  },
  async save(a){
    if(this.db){try{await this.db.doc("analyses/"+a.id).set(a);return}catch(e){}}
    try{const l=await this.list();const i=l.findIndex(x=>x.id===a.id);if(i>=0)l[i]=a;else l.push(a);localStorage.setItem("hub:analyses",JSON.stringify(l))}catch(e){}
  },
  async del(id){
    if(this.db){try{await this.db.doc("analyses/"+id).delete()}catch(e){}}
    try{const l=(await this.list()).filter(x=>x.id!==id);localStorage.setItem("hub:analyses",JSON.stringify(l))}catch(e){}
  }
};

/* ---------- boot ---------- */
(async()=>{
  $("#taggerLink").href=TAGGER;
  await Store.init();
  try{
    const r=await fetch("data.json");DATA=await r.json();
  }catch(e){$("#body").innerHTML=`<div class="empty">Could not load <code>data.json</code>. It must sit next to this page.</div>`;return}
  DATA.clubs.forEach(c=>{byShort[c.short]=c;byName[c.name.toUpperCase()]=c});
  $("#sub").textContent=`${DATA.competition} · updated ${DATA.updated} · source ${DATA.source}`;
  analyses=await Store.list();
  render();
})();

$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  view={tab:b.dataset.tab};document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));render()});

function render(){
  const b=$("#body");
  if(!DATA){return}
  if(view.club){b.innerHTML=renderClub(view.club);wire();return}
  if(view.analysis){b.innerHTML=renderAnalysisDetail(view.analysis);wire();return}
  b.innerHTML=({standings:renderStandings,fixtures:renderFixtures,clubs:renderClubs,players:renderPlayers,scorers:renderScorers,status:renderStatus,analysis:renderAnalysisTab}[view.tab]||renderStandings)();
  wire();
}
function wire(){
  document.querySelectorAll("[data-club]").forEach(el=>el.onclick=()=>{view={tab:view.tab||"clubs",club:el.dataset.club};render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-back]").forEach(el=>el.onclick=()=>{view={tab:el.dataset.back};render()});
  const ps=$("#playerSearch");if(ps){ps.oninput=()=>renderPlayerRows(ps.value);ps.focus()}
  const imp=$("#csvIn");if(imp)imp.onchange=onImport;
  document.querySelectorAll("[data-an]").forEach(el=>el.onclick=()=>{view={tab:"analysis",analysis:el.dataset.an};render();window.scrollTo(0,0)});
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async ev=>{ev.stopPropagation();if(!confirm("Remove this analysis?"))return;await Store.del(el.dataset.del);analyses=await Store.list();render()});
  document.querySelectorAll("[data-anper]").forEach(el=>el.onclick=()=>{anPeriod=el.dataset.anper;render()});
  document.querySelectorAll("[data-stf]").forEach(el=>el.onclick=()=>{statusFilter=el.dataset.stf;render()});
}
const teamCell=(short,cls="")=>{const c=byShort[short];return`<span class="tm ${cls}"><span class="swatch" style="background:${c?esc(c.color):"#888"}"></span><span>${c?esc(c.name):esc(short)}</span></span>`};

/* ---------- standings ---------- */
function nextMatchCard(){
  const n=DATA.next_match;if(!n)return"";
  const dfmt=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  return `<div class="card nextm"><span class="badge">Next · ${esc(n.round)}</span>${teamCell(n.home)}<span class="mono">vs</span>${teamCell(n.away)}
    <span class="note">${dfmt(n.date)} · ${esc(n.time||"")} · ${esc(n.venue||"")}</span></div>`;
}
function renderStandings(){
  const g=k=>{const rows=DATA.standings[k],full=rows.some(r=>r.p!=null);
    return `<div class="grp card"><h2>Group ${k}</h2><table><thead><tr><th class="pos">#</th><th>Club</th>${full?'<th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th><th class="n">GF</th><th class="n">GA</th>':""}<th class="n">Pts</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="clickable" data-club="${esc(r.short)}"><td class="pos">${r.rank}</td>
      <td><div style="display:flex;gap:6px;align-items:baseline"><span class="swatch" style="background:${esc(byShort[r.short].color)};flex:none"></span><span class="${r.short===MYCLUB?"me":""}">${esc(r.name)}</span></div></td>
      ${full?["p","w","d","l","gf","ga"].map(k=>`<td class="n mono">${r[k]??""}</td>`).join(""):""}
      <td class="n"><b>${r.pts}</b></td></tr>`).join("")}</tbody></table></div>`};
  return `${nextMatchCard()}<div class="stand">${g("A")}${g("B")}${g("C")}</div>
    <p class="note" style="margin-top:12px">Order and points from ileague.id. Group B W/D/L and goals are counted from the official match pages (rounds 1–4); where clubs are level on all of those (PERSIBA and Persibo), ileague's own tiebreak decides. Tap a club for its squad and players to watch.</p>`;
}

/* ---------- fixtures ---------- */
function analysisForFixture(home,away){return analyses.find(a=>(a.homeShort===home&&a.awayShort===away)||(a.homeShort===away&&a.awayShort===home))}
function fxRow(f){
  const an=analysisForFixture(f.home,f.away);
  const played=f.hg!=null;
  const sc=[...(f.scorers_home||[]).map(x=>esc(x)),...(f.scorers_away||[]).map(x=>esc(x))];
  return `<div class="fxrow">
    <div class="h">${teamCell(f.home)}</div>
    <div class="sc mono">${played?`${f.hg}–${f.ag}`:esc(f.time||"vs")}</div>
    <div>${teamCell(f.away)}</div>
    ${played&&sc.length?`<div class="scorers">${(f.scorers_home||[]).map(esc).join(", ")}${f.scorers_home?.length&&f.scorers_away?.length?" · ":""}${(f.scorers_away||[]).map(esc).join(", ")}</div>`:""}
    <div class="fxmeta"><span>${esc(f.round||"")}${f.group?" · Group "+esc(f.group):""}${f.venue?" · "+esc(f.venue):""}</span>${an?`<span class="badge on" data-an="${esc(an.id)}" style="cursor:pointer">Analysed</span>`:""}</div>
  </div>`;
}
function renderFixtures(){
  const dfmt=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  const sect=(title,list,desc)=>{const days={};list.forEach(f=>{(days[f.date]=days[f.date]||[]).push(f)});
    let out=`<h2 style="font-size:18px;text-transform:uppercase;margin:14px 0 4px">${title}</h2>`;
    Object.keys(days).sort((a,b)=>desc?b.localeCompare(a):a.localeCompare(b)).forEach(d=>{out+=`<div class="fxday">${dfmt(d)}</div><div class="fx">${days[d].map(fxRow).join("")}</div>`});return out};
  const up=DATA.fixtures.filter(f=>f.hg==null),res=DATA.fixtures.filter(f=>f.hg!=null);
  let s=nextMatchCard()+sect("Upcoming",up,false)+sect("Results",res,true);
  const sch=DATA.persiba_schedule||[];
  if(sch.length){s+=`<h2 style="font-size:18px;text-transform:uppercase;margin:18px 0 4px"><span class="me">PERSIBA Bantul</span> — run-in</h2><div class="fx">`;
    sch.forEach(f=>{const an=analysisForFixture(f.home,f.away);s+=`<div class="fxrow"><div class="h">${teamCell(f.home)}</div><div class="sc mono">vs</div><div>${teamCell(f.away)}</div>
      <div class="fxmeta"><span>${esc(f.round)} · ${dfmt(f.date)}</span>${an?`<span class="badge on" data-an="${esc(an.id)}" style="cursor:pointer">Analysed</span>`:""}</div></div>`});
    s+=`</div>`}
  s+=`<p class="note" style="margin-top:10px">Group B: every result with scorers (rounds 1–4). Groups A/C: Pekan 2 results only. Import a tagged match or Track B report in <b>My analysis</b> and it tags the fixture here.</p>`;
  return s;
}

/* ---------- analysis status ---------- */
const STAGE_ORDER=["reviewed","analysed","queued","ready","needs_times","needs_video","not_set_up","upcoming"];
let statusFilter="persiba";
function renderStatus(){
  const rows=(DATA.status||[]).map(r=>{const an=analysisForFixture(r.home,r.away);return{...r,inHub:!!an,anId:an?.id}});
  const pick=statusFilter==="persiba"?rows.filter(r=>r.why.length):rows;
  const cnt=k=>rows.filter(r=>r.stage===k).length;
  const sum=[["analysed","Analysed",cnt("analysed")+cnt("reviewed")],["queued","Queued",cnt("queued")],["ready","Ready to run",cnt("ready")],
    ["needs_times","Needs info",cnt("needs_times")+cnt("needs_video")],["not_set_up","Not set up",cnt("not_set_up")]];
  const dfmt=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const sorted=pick.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.home.localeCompare(b.home));
  return `${nextMatchCard()}<h2 style="font-size:18px;text-transform:uppercase;margin:4px 0">Analysis status — Group B</h2>
  <p class="note">Which matches have been through Track B (automatic tracking) and which still need something. Played matches only count once they are in the match config.</p>
  <div class="stsum">${sum.map(([k,l,n])=>`<div class="card"><b>${n}</b><span class="st ${k}">${l}</span></div>`).join("")}</div>
  <div class="filters" style="display:flex;gap:6px;margin-bottom:8px">
    <button class="btn small ${statusFilter==="persiba"?"primary":""}" data-stf="persiba">PERSIBA + next opponent</button>
    <button class="btn small ${statusFilter==="all"?"primary":""}" data-stf="all">All Group B</button></div>
  <div class="card"><div class="tablewrap"><table class="tb"><thead><tr><th>Date</th><th>Round</th><th>Match</th><th>Status</th><th>Why</th><th>Hub</th></tr></thead><tbody>
  ${sorted.map(r=>`<tr><td class="mono">${dfmt(r.date)}</td><td>${esc(r.round)}</td>
    <td>${teamCell(r.home)} <span class="mono">${r.played?`${r.hg}–${r.ag}`:"vs"}</span> ${teamCell(r.away)}</td>
    <td><span class="st ${esc(r.stage)}" title="${esc(r.notes||"")}">${esc(r.label)}</span></td>
    <td class="note">${esc(r.why.join(" · "))}</td>
    <td>${r.inHub?`<span class="badge on" data-an="${esc(r.anId)}" style="cursor:pointer">In Hub</span>`:""}</td></tr>`).join("")}
  </tbody></table></div></div>
  <p class="note" style="margin-top:8px"><b>Analysed</b> = Track B report and event candidates exist. <b>Queued</b> = in a Kaggle batch. <b>Ready</b> = video and period times are set; just run it. <b>Needs info</b> = period times or video missing. <b>In Hub</b> = you imported its report or tagged events here.</p>`;
}

/* ---------- clubs ---------- */
function renderClubs(){
  const order=[...DATA.clubs].sort((a,b)=>(a.group+a.name).localeCompare(b.group+b.name));
  return `<div class="grid-cards">${order.map(c=>`<div class="card clubcard" data-club="${esc(c.short)}">
    <span class="bar" style="background:${esc(c.color)}"></span>
    <div><h3 class="${c.short===MYCLUB?"me":""}">${esc(c.name)}</h3>

/* ---------- scouting profile from stored Track B reports ---------- */
function clubProfile(short){
  const ms=analyses.filter(a=>a.tracking&&(a.homeShort===short||a.awayShort===short))
    .sort((a,b)=>String(a.tracking.date||"").localeCompare(String(b.tracking.date||"")));
  if(!ms.length)return"";
  const col=byShort[short]?.color||"#1d5fc4";
  const per=(a,k)=>{const sd=a.homeShort===short?"home":"away",op=sd==="home"?"away":"home",b=a.tracking.periods?.[k];
    if(!b)return null;const t=b.territory_home_view||{};
    return{me:b[sd]||{},opp:b[op]||{},att:sd==="home"?t.att_third:t.def_third,own:sd==="home"?t.def_third:t.att_third}};
  const avg=(xs)=>{xs=xs.filter(v=>v!=null&&isFinite(v));return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null};
  const rows=ms.map(a=>{const sd=a.homeShort===short?"home":"away",p=per(a,"all")||{me:{},opp:{}};
    const gf=sd==="home"?a.hg:a.ag,ga=sd==="home"?a.ag:a.hg,opp=sd==="home"?a.away:a.home;
    return{a,sd,p,gf,ga,opp}});
  const cell=(v,f)=>`<td class="n">${f(v)}</td>`;
  const half=k=>{const ps=ms.map(a=>per(a,k)).filter(Boolean);return{
    poss:avg(ps.map(p=>possOf(p.me))),blk:avg(ps.map(p=>p.me.block_height_m)),
    oop:avg(ps.map(p=>p.me.block_height_out_of_possession_m)),line:avg(ps.map(p=>p.me.def_line_m)),n:ps.length}};
  const h1=half("1"),h2=half("2");
  // average own heatmap (each match normalised to its own max first)
  let heat=null,grid=null;
  ms.forEach(a=>{const h=per(a,"all")?.me?.heatmap;if(!h)return;grid=a.tracking.grid;
    if(!heat)heat=h.map(c=>c.map(()=>0));h.forEach((c,i)=>c.forEach((v,j)=>heat[i][j]+=v/ms.length))});
  if(heat){const mx=Math.max(...heat.flat())||1;heat=heat.map(c=>c.map(v=>v/mx))}
  const d=(x,y,f)=>x==null||y==null?"—":((y-x)>=0?"+":"")+f(y-x);
  return `<h3 style="font-size:17px;text-transform:uppercase;margin:14px 0 6px">Scouting profile — Track B (${ms.length} match${ms.length>1?"es":""})</h3>
  <div class="card"><div class="tablewrap"><table class="tb"><thead><tr><th>Match</th><th class="n">Score</th><th class="n">Possession</th><th class="n">Press</th><th class="n">Block</th><th class="n">Block out of poss.</th><th class="n">Back line</th><th class="n">Width</th><th class="n">Ball in att. third</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="clickable" data-an="${esc(r.a.id)}"><td>${r.sd==="home"?"vs":"@"} ${esc(r.opp)} <span class="note">${esc(r.a.tracking.date||"")}</span></td><td class="n mono">${r.gf}–${r.ga}</td>
      ${cell(possOf(r.p.me),pct)}${cell(r.p.me.press_share,pct)}${cell(r.p.me.block_height_m,mtr)}${cell(r.p.me.block_height_out_of_possession_m,mtr)}${cell(r.p.me.def_line_m,mtr)}${cell(r.p.me.width_m,mtr)}${cell(r.p.att,pct)}</tr>`).join("")}
    <tr><td><b>Average</b></td><td></td>${cell(avg(rows.map(r=>possOf(r.p.me))),pct)}${cell(avg(rows.map(r=>r.p.me.press_share)),pct)}${cell(avg(rows.map(r=>r.p.me.block_height_m)),mtr)}${cell(avg(rows.map(r=>r.p.me.block_height_out_of_possession_m)),mtr)}${cell(avg(rows.map(r=>r.p.me.def_line_m)),mtr)}${cell(avg(rows.map(r=>r.p.me.width_m)),mtr)}${cell(avg(rows.map(r=>r.p.att)),pct)}</tr>
  </tbody></table></div>
  <p class="note" style="margin-top:8px">1st → 2nd half: possession ${d(h1.poss,h2.poss,v=>Math.round(v*100)+" pts")}, block ${d(h1.blk,h2.blk,v=>v.toFixed(1)+" m")}, block out of possession ${d(h1.oop,h2.oop,v=>v.toFixed(1)+" m")}, back line ${d(h1.line,h2.line,v=>v.toFixed(1)+" m")}. Metres from own goal; + = higher up the pitch.</p>
  ${heat?`<div style="max-width:560px;margin-top:10px"><div class="note" style="margin-bottom:6px">Average positions, attacking →</div>${heatSvg(heat,grid,col)}</div>`:""}
  <p class="note" style="margin-top:6px">Built from the Track B reports imported in My analysis. Proxies from broadcast tracking — read trends, not exact values.</p></div>`;
}

function anSummary(a,period){
  const sh=(a.shotList||[]).filter(s=>period==="all"||String(s.half)===period||(period==="et"&&s.half>=3));
  const o={hg:0,ag:0,hx:0,ax:0,hs:0,as:0,hon:0,aon:0,sh};
  sh.forEach(s=>{const h=s.side==="home";
    if(h){o.hs++;o.hx+=s.xg;if(s.goal)o.hg++;if(s.on)o.hon++}else{o.as++;o.ax+=s.xg;if(s.goal)o.ag++;if(s.on)o.aon++}});
  return o;
}
function renderAnalysisDetail(id){
  const a=analyses.find(x=>x.id===id);if(!a)return`<div class="empty">Analysis not found.</div>`;
  const seen=new Set((a.shotList||[]).map(s=>String(s.half)));
  Object.keys(a.tracking?.periods||{}).forEach(k=>{if(k!=="all")seen.add(k)});
  const periods=["all","1","2",...["3","4"].filter(p=>seen.has(p))];
  if(seen.has("3")||seen.has("4"))periods.push("et");
  if(!periods.includes(anPeriod))anPeriod="all";
  const lbl={all:"Full","1":"1st half","2":"2nd half","3":"ET first half","4":"ET second half",et:"Extra time"};
  const m=anSummary(a,anPeriod);const tagged=(a.shotList||[]).length>0;
  if(!tagged&&anPeriod==="all"){m.hg=a.hg;m.ag=a.ag}
  const score=(!tagged&&anPeriod!=="all")?"–":`${m.hg}–${m.ag}`;
  const seg=`<div class="row" style="margin:0 0 10px;gap:6px">${periods.map(p=>`<button class="btn small ${p===anPeriod?"on":""}" data-anper="${esc(p)}">${esc(lbl[p])}</button>`).join("")}</div>`;
  return `<button class="btn small back" data-back="analysis">← Back</button>
    <div class="card"><h2 style="font-size:22px">${esc(a.home)} <span class="mono">${score}</span> ${esc(a.away)}</h2>
    <div class="note">${esc(a.matchName||"")} · imported ${new Date(a.importedAt).toLocaleDateString()}</div>
    ${seg}
    ${tagged?`<div class="kv">
      <div><div class="k">xG</div><div class="v mono">${m.hx.toFixed(2)} – ${m.ax.toFixed(2)}</div></div>
      <div><div class="k">Shots</div><div class="v mono">${m.hs} – ${m.as}</div></div>
      <div><div class="k">On target</div><div class="v mono">${m.hon} – ${m.aon}</div></div>
    </div>`:`<p class="note">Not tagged yet — import the Tagger CSV for shots and xG.</p>`}</div>
    ${tagged?`<h3 style="font-size:16px;text-transform:uppercase;margin:12px 0 6px">Shot map${anPeriod==="all"?"":" — "+esc(lbl[anPeriod])}</h3>
    <div class="card">${shotMap(a,m.sh)}</div>
    <p class="note" style="margin-top:8px">Circle size = xG, filled = goal. ${esc(a.home)} attacks right, ${esc(a.away)} left. Open the full match in the Pitchside Tagger for passes, xT and reels.</p>`:""}
    ${trackingSection(a,anPeriod,lbl)}`;
}
function pct(v){return v==null?"—":Math.round(v*100)+"%"}
function mtr(v){return v==null?"—":(+v).toFixed(1)+" m"}
function trackingSection(a,period,lbl){
  const T=a.tracking;if(!T)return"";
  if(period==="et")return`<p class="note" style="margin-top:12px">Track B report: pick ET first half or ET second half.</p>`;
  const b=T.periods?.[period];
  if(!b)return`<p class="note" style="margin-top:12px">No Track B data for ${esc(lbl[period]||period)}.</p>`;
  const H=b.home||{},A=b.away||{},q=b.quality||{},t=b.territory_home_view||{};
  const hc=byShort[a.homeShort]?.color||"#d7263d",ac=byShort[a.awayShort]?.color||"#1d5fc4";
  const row=(label,k,f)=>`<tr><td>${label}</td><td class="n">${f(H[k])}</td><td class="n">${f(A[k])}</td></tr>`;
  const seg=(w,c,txt)=>w>0?`<div style="flex:${w};background:${c}" title="${esc(txt)}">${w>=0.12?esc(txt):""}</div>`:"";
  return `<h3 style="font-size:16px;text-transform:uppercase;margin:16px 0 6px">Team shape — Track B${period==="all"?"":" · "+esc(lbl[period])}</h3>
  <div class="card">
    ${(T.warnings||[]).map(w=>`<div class="qual" style="color:var(--bad,#b42318);font-weight:600">⚠ ${esc(w)}</div>`).join("")}
    <div class="qual">Data quality: wide camera ${pct(q.wide_share)} · team known ${pct(q.known_team_share)} · ball visible ${pct(q.ball_visible_share)} · ${q.ball_near_frames??0} ball-near samples</div>
    <div class="tablewrap"><table class="tb"><thead><tr><th></th><th class="n"><span class="swatch" style="background:${hc}"></span> ${esc(a.home)}</th><th class="n"><span class="swatch" style="background:${ac}"></span> ${esc(a.away)}</th></tr></thead><tbody>
      ${H.possession_share!=null?row("Possession (time share)","possession_share",pct):""}
      ${row(H.possession_share!=null?"Ball-proximity share (diagnostic)":"Ball-proximity share (possession proxy)","ball_proximity_share",pct)}
      ${H.press_share!==undefined?row("Press share (opponent's own third, ≤5 m)","press_share",pct):""}
      ${row("Block height (from own goal)","block_height_m",mtr)}
      ${row("· in possession","block_height_in_possession_m",mtr)}
      ${row("· out of possession","block_height_out_of_possession_m",mtr)}
      ${row("Back line","def_line_m",mtr)}
      ${row("Width","width_m",mtr)}
      ${row("Length","length_m",mtr)}
    </tbody></table></div>
    <div class="k" style="margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Where the ball was (${esc(a.home)} attacking →)</div>
    <div class="terr">${seg(t.def_third||0,"#6b7280",`own third ${pct(t.def_third)}`)}${seg(t.middle||0,"#8a8f98",`middle ${pct(t.middle)}`)}${seg(t.att_third||0,hc,`attacking third ${pct(t.att_third)}`)}</div>
  </div>
  <div class="heat2" style="margin-top:12px">
    <div class="card"><div class="note" style="margin-bottom:6px">${esc(a.home)} — positions, attacking →</div>${heatSvg(H.heatmap,T.grid,hc)}</div>
    <div class="card"><div class="note" style="margin-bottom:6px">${esc(a.away)} — positions, attacking →</div>${heatSvg(A.heatmap,T.grid,ac)}</div>
  </div>
  ${summaryCard(T,a,hc,ac)}
  <p class="note" style="margin-top:8px">${esc(T.method?.caveat||"")} Block height and back line are metres from the team's own goal line.</p>`;
}
function summaryCard(T,a,hc,ac){
  const S=T.summary;if(!S)return"";
  const P=T.physical||{},tt=P.team_totals||{},by=P.by_player||[];
  const srow=(label,k,f)=>`<tr><td>${label}</td><td class="n">${f(S.home?.[k])}</td><td class="n">${f(S.away?.[k])}</td></tr>`;
  const km=v=>v==null?"—":v+" km",kmh=v=>v==null?"—":v+" km/h",n0=v=>v==null?"—":v;
  const phys=S.home?.distance_km!=null;
  const nm={home:esc(a.home),away:esc(a.away)};
  const byRows=by.slice().sort((x,y)=>x.team===y.team?y.distance_m-x.distance_m:(x.team<y.team?-1:1)).slice(0,40)
    .map(r=>`<tr><td>${nm[r.team]||r.team}</td><td class="n">${esc(r.number)}</td><td class="n">${(r.distance_m/1000).toFixed(1)}</td><td class="n">${(r.hi_distance_m/1000).toFixed(1)}</td><td class="n">${(r.sprint_distance_m/1000).toFixed(1)}</td><td class="n">${r.top_speed_kmh}</td><td class="n">${r.touches}</td></tr>`).join("");
  return `<h3 style="font-size:16px;text-transform:uppercase;margin:16px 0 6px">Match summary — Track B</h3>
  <div class="card"><div class="tablewrap"><table class="tb"><thead><tr><th></th><th class="n"><span class="swatch" style="background:${hc}"></span> ${esc(a.home)}</th><th class="n"><span class="swatch" style="background:${ac}"></span> ${esc(a.away)}</th></tr></thead><tbody>
    ${srow("Possession","possession_share",pct)}
    ${srow("Press share","press_share",pct)}
    ${srow("Counter-press regain","counter_press_regain_share",pct)}
    ${srow("Losses (possession lost)","counter_press_losses",n0)}
    ${srow("Width","width_m",mtr)}${srow("Length","length_m",mtr)}
    ${phys?srow("Distance run","distance_km",km):""}
    ${phys?srow("High-intensity dist.","hi_distance_km",km):""}
    ${phys?srow("Sprint distance","sprint_distance_km",km):""}
    ${phys?srow("Top speed (est.)","top_speed_kmh",kmh):""}
  </tbody></table></div>
  ${phys?"":`<p class="note" style="margin-top:8px">Physical running totals appear once the match is processed with the player-physical pass.</p>`}
  ${byRows?`<div class="k" style="margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Players — physical (per shirt number, from OCR)</div>
    <div class="tablewrap"><table class="tb"><thead><tr><th>Team</th><th class="n">#</th><th class="n">Dist km</th><th class="n">HI km</th><th class="n">Sprint km</th><th class="n">Top km/h</th><th class="n">Touches</th></tr></thead><tbody>${byRows}</tbody></table></div>`:""}
  <p class="note" style="margin-top:8px">Counter-press regain = share of this team's turnovers won back within 5 s. Distance/speed are broadcast-tracking proxies (on-camera running only); per-player rows need shirt-number OCR.</p></div>`;
}
function possOf(me){return me?(me.possession_share!=null?me.possession_share:me.ball_proximity_share):null}   // older reports: proximity proxy
function heatSvg(h,grid,col){
  if(!h||!h.length)return`<div class="empty">No positions.</div>`;
  const nx=grid?.[0]||h.length,ny=grid?.[1]||h[0].length,cw=PL/nx,ch=PW/ny;let cells="";
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const v=h[i]?.[j]||0;if(v<0.04)continue;
    cells+=`<rect x="${(i*cw).toFixed(2)}" y="${(j*ch).toFixed(2)}" width="${(cw+.05).toFixed(2)}" height="${(ch+.05).toFixed(2)}" fill="${col}" fill-opacity="${(0.12+0.78*Math.sqrt(v)).toFixed(2)}"/>`}
  return `<svg class="pitch" viewBox="-4 -4 113 76" role="img" aria-label="Position heatmap"><rect x="-4" y="-4" width="113" height="76" fill="var(--turf)"/>${cells}
    <g fill="none" stroke="var(--chalk)" stroke-width=".35"><rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/><rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/></g></svg>`;
}
function shotMap(a,shots){
  shots=shots||a.shotList||[];
  const base=`<rect x="-4" y="-4" width="113" height="76" fill="var(--turf)"/>`+
    `<g fill="none" stroke="var(--chalk)" stroke-width=".35"><rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>`+
    `<rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/></g>`;
  const dots=shots.map(s=>{
    const [x,y]=s.side==="home"?[s.x,s.y]:[PL-s.x,PW-s.y];
    const col=s.side==="home"?(byShort[a.homeShort]?.color||"#d7263d"):(byShort[a.awayShort]?.color||"#1d5fc4");
    const r=0.9+Math.sqrt(Math.max(0,s.xg))*4.2,goal=s.goal;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${goal?col:"none"}" stroke="${col}" stroke-width=".45"><title>${esc(s.side)} xG ${s.xg.toFixed(2)}${goal?" — GOAL":""}</title></circle>`;
  }).join("");
  return `<svg class="pitch" viewBox="-4 -4 113 76" role="img" aria-label="Shot map">${base}${dots}</svg>`;
}
function parseCSV(t){const out=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===","){row.push(cur);cur=""}else if(c==="\n"){row.push(cur);out.push(row);row=[];cur=""}else if(c!=="\r")cur+=c}
  if(cur||row.length){row.push(cur);out.push(row)}return out.filter(r=>r.length>1)}
function resolveShort(name){const u=String(name||"").toUpperCase().trim();if(byName[u])return byName[u].short;
  for(const c of DATA.clubs){const cn=c.name.toUpperCase();if(cn.includes(u)||u.includes(cn))return c.short}return null}
function onImport(e){
  const files=[...e.target.files];e.target.value="";
  (async()=>{for(const f of files){const text=await f.text();
    if(/\.json$/i.test(f.name)||text.trimStart().startsWith("{"))await importReport(text);else await importCsv(text)}})();
}
async function importReport(text){
  let rep;try{rep=JSON.parse(text)}catch(e){toast("Could not read that JSON");return}
  if(rep.schema!=="trackb_team_report_v1"){toast("That JSON is not a Track B team report");return}
  const hs=resolveShort(rep.home),as=resolveShort(rep.away);
  let a=analyses.find(x=>x.id===rep.match_id)||analyses.find(x=>x.homeShort&&x.homeShort===hs&&x.awayShort===as);
  if(!a)a={id:rep.match_id,matchName:[rep.round,rep.date].filter(Boolean).join(" · "),home:rep.home,away:rep.away,
    homeShort:hs,awayShort:as,hg:rep.score?.[0]??0,ag:rep.score?.[1]??0,homeXg:0,awayXg:0,homeShots:0,awayShots:0,homeOn:0,awayOn:0,shots:0,shotList:[]};
  a={...a,tracking:rep,importedAt:Date.now()};
  await Store.save(a);analyses=await Store.list();
  toast(`Track B report added: ${a.home} vs ${a.away}`);
  view={tab:"analysis",analysis:a.id};render();window.scrollTo(0,0);
}
async function importCsv(text){
  try{
    const rows=parseCSV(String(text));const head=rows.shift().map(h=>h.trim());const ix=n=>head.indexOf(n);
    if(ix("event")<0){toast("That doesn't look like a Tagger CSV");return}
    const g=(r,n)=>ix(n)<0?"":String(r[ix(n)]??"").trim();
    const matchId=g(rows[0],"match_id")||("m"+Date.now()), matchName=g(rows[0],"match_name");
    const side={home:{xg:0,shots:0,on:0,goals:0,name:""},away:{xg:0,shots:0,on:0,goals:0,name:""}};
    const shotList=[];
    rows.forEach(r=>{
      const sd=g(r,"side")==="away"?"away":"home", team=g(r,"team");
      if(team)side[sd].name=team;
      if(g(r,"event")==="shot"){
        const xg=parseFloat(g(r,"xg"))||0, out=g(r,"outcome"), goal=out==="goal";
        const on=goal||out==="on target";
        side[sd].shots++;side[sd].xg+=xg;if(on)side[sd].on++;if(goal)side[sd].goals++;
        shotList.push({side:sd,x:parseFloat(g(r,"x"))||0,y:parseFloat(g(r,"y"))||0,xg,goal,on,half:parseInt(g(r,"half"))||1});
      }
    });
    if(!shotList.length){toast("No shots found in that CSV");return}
    const a={id:matchId,matchName,home:side.home.name||"Home",away:side.away.name||"Away",
      homeShort:resolveShort(side.home.name),awayShort:resolveShort(side.away.name),
      hg:side.home.goals,ag:side.away.goals,homeXg:side.home.xg,awayXg:side.away.xg,
      homeShots:side.home.shots,awayShots:side.away.shots,homeOn:side.home.on,awayOn:side.away.on,
      shots:side.home.shots+side.away.shots,shotList,importedAt:Date.now()};
    const prev=analyses.find(x=>x.id===a.id)||analyses.find(x=>x.homeShort&&x.homeShort===a.homeShort&&x.awayShort===a.awayShort);
    if(prev?.tracking){a.tracking=prev.tracking;if(prev.id!==a.id)await Store.del(prev.id)}
    await Store.save(a);analyses=await Store.list();
    toast(`Imported ${a.home} ${a.hg}–${a.ag} ${a.away}`);
    view={tab:"analysis",analysis:a.id};render();window.scrollTo(0,0);
  }catch(err){toast("Could not read that CSV")}
}
})();
</script>
