name: Track B unit tests

on:
  push:
    branches:
      - track-b/automatic-tracking-v1
  pull_request:
    branches:
      - main

jobs:
  track-b-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pandas matplotlib pytest

      - name: Compile Track B Python sources
        run: |
          python -m compileall -q scripts/track_video.py scripts/download_sports_models.py src/heatmap_from_positions.py tests

      - name: Run unit tests
        run: python -m pytest tests -q
